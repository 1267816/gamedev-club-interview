<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VN-01</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 封面:与游戏一致的终端风格。游戏标题 + 新游戏 / 加载存档 + 版本号 -->
  <div id="cover">
    <div class="cover-box">
      <div class="cover-title">VN-01</div>
      <div class="cover-sub">自复制探测器 · 命令行系统</div>
      <div class="cover-menu">
        <button id="btn-new">[ 新游戏 ]</button>
        <button id="btn-load">[ 加载存档 ]</button>
      </div>
      <div class="cover-version" id="cover-version">版本 —</div>
    </div>
  </div>

  <!-- 游戏主界面 -->
  <div id="screen" class="hidden">

    <!-- 顶部:系统标题 + 运行计时 -->
    <header id="header">
      <span id="header-title">--</span>
      <span id="header-time">T+00:00:00</span>
    </header>

    <!-- 主区:终端日志流(叙事在这里展开) -->
    <main id="log" aria-live="polite"></main>

    <!-- 侧栏:资源/产出读数(文字 + ASCII 条,不放日志) -->
    <aside id="side">
      <div id="readout"></div>
    </aside>

    <!-- 底部:命令提示行 + 可点击的命令 -->
    <footer id="prompt">
      <div id="ps1"><span>&gt;</span> <span id="caret"></span></div>
      <div id="commands"></div>
    </footer>

  </div>

  <script src="game-data.js"></script>
  <script src="game.js"></script>
</body>
</html>
