<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星海漫游</title>
  <!-- 空图标:避免浏览器去请求 favicon.ico(那样控制台会出现一条 404 红字) -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>

  <!-- 封面:与游戏一致的终端风格。游戏标题 + 新游戏 / 加载存档 + 版本号 -->
  <div id="cover">
    <div class="cover-box">
      <div class="cover-title">星海漫游</div>
      <div class="cover-sub">一个关于自复制探测器的故事</div>
      <div class="cover-menu">
        <button id="btn-new">[ 新游戏 ]</button>
        <button id="btn-load">[ 加载存档 ]</button>
        <button id="btn-achievements">[ 成就 ]</button>
        <button id="btn-author-cover">[ 作者的话 ]</button>
        <button id="btn-settings">[ 设置 ]</button>
        <button id="btn-quit">[ 退出 ]</button>
      </div>
      <div class="cover-version" id="cover-version">版本 —</div>
    </div>
  </div>

  <!-- 设置:音乐 / 音效音量(音频接口已就绪,暂未加载素材) -->
  <div id="settings" class="hidden">
    <div class="panel">
      <div class="panel-title">设置</div>
      <div id="settings-list"></div>
      <div class="panel-note">音频接口已就绪,暂未加载音频素材。</div>
      <div class="panel-menu">
        <button id="btn-settings-back">[ 返回 ]</button>
      </div>
    </div>
  </div>

  <!-- 退出 -->
  <div id="quit" class="hidden">
    <div class="panel">
      <div class="panel-title">会话已终止</div>
      <div class="panel-note">可以安全关闭此页面。</div>
    </div>
  </div>

  <!-- 成就(Q4:未获得的成就隐藏,只在封面展示) -->
  <div id="achievements" class="hidden">
    <div class="panel">
      <div class="panel-title">成就</div>
      <div class="panel-note" id="ach-count">已解锁 0 / 0</div>
      <div id="ach-list"></div>
      <div class="panel-menu">
        <button id="btn-ach-back">[ 返回 ]</button>
      </div>
    </div>
  </div>

  <!-- 结局结算(S18):可以继续运行,也可以回到选择时刻重选 -->
  <div id="ending" class="hidden">
    <div class="panel">
      <div class="panel-title" id="end-title">结局</div>
      <div class="panel-note" id="end-note"></div>
      <div class="panel-menu">
        <button id="btn-end-continue">[ 继续运行 ]</button>
        <button id="btn-end-author">[ 作者的话 ]</button>
        <button id="btn-end-choice">[ 回到选择时刻 ]</button>
        <button id="btn-end-back">[ 返回封面 ]</button>
      </div>
    </div>
  </div>

  <!-- 作者的话(S19):接口已就绪,正文在 game-data.js 的 authorsNote 里(等用户写) -->
  <div id="author" class="hidden">
    <div class="panel">
      <div class="panel-title" id="author-title">作者的话</div>
      <div id="author-body"></div>
      <div class="panel-note" id="author-foot"></div>
      <div class="panel-menu">
        <button id="btn-author-back">[ 返回 ]</button>
      </div>
    </div>
  </div>

  <!-- 游戏主界面 -->
  <div id="screen" class="hidden">

    <!-- 顶部:系统标题 + 运行计时 -->
    <header id="header">
      <span id="header-title">--</span>
      <span id="header-time">T+00:00:00</span>
    </header>

    <!-- 主区:终端日志流(叙事在这里展开) -->
    <main id="log" aria-live="polite"></main>

    <!-- 侧栏:资源/产出读数(文字 + ASCII 条,不放日志) -->
    <aside id="side">
      <div id="readout"></div>
    </aside>

    <!-- 底部:命令提示行 + 可点击的命令 -->
    <footer id="prompt">
      <div id="ps1"><span>&gt;</span><input id="cmd-input" type="text" autocomplete="off" spellcheck="false"></div>
      <div id="palette" class="hidden"></div>
      <div id="hint"></div>
      <div id="commands"></div>
    </footer>

  </div>

  <!-- 科技树:整屏替换终端(/research 打开、/back 或 Esc 返回) -->
  <!-- 科技树:整屏替换终端(右侧复用终端那块读数面板) -->
  <div id="tech" class="hidden">
    <header id="tech-header">
      <span id="tech-title">科技树</span>
      <span id="tech-count">已解锁 0 / 0</span>
    </header>
    <div id="tech-filters">
      <div class="filter-row"><span class="filter-label">状态</span><span id="tech-status"></span></div>
      <div class="filter-row"><span class="filter-label">类别</span><span id="tech-cats"></span></div>
      <div class="filter-row"><span class="filter-label">搜索</span><input id="tech-search" type="text" autocomplete="off" spellcheck="false"></div>
    </div>
    <main id="tech-list" tabindex="0" aria-label="科技节点列表"></main>
    <div id="tech-detail"></div>
    <footer id="tech-foot">
      <div id="tech-pending" class="hidden"></div>
      <div id="tech-hint"></div>
      <div id="tech-ps1"><span>&gt;</span><input id="tech-input" type="text" autocomplete="off" spellcheck="false"></div>
      <div id="tech-palette" class="hidden"></div>
    </footer>
    <aside id="side-tech">
      <div id="readout-tech"></div>
    </aside>
  </div>

  <script src="src/js/game-data.js"></script>
  <script src="src/js/game.js"></script>
</body>
</html>
